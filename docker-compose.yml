services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatpilot
      POSTGRES_PASSWORD: chatpilot_dev
      POSTGRES_DB: chatpilot
    ports:
      - "5432:5432"
    volumes:
      - chatpilot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  chatpilot_pg:
